# Backup route if Undercurrent.xcodeproj ever won't open:
#   brew install xcodegen && cd journal && xcodegen
# regenerates the project from this file.
name: Undercurrent
options:
  bundleIdPrefix: app.undercurrent
  deploymentTarget:
    iOS: "17.0"
targets:
  Undercurrent:
    type: application
    platform: iOS
    sources: [Undercurrent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.undercurrent.journal
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Undercurrent
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Undercurrent listens while you dictate an entry.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Undercurrent turns what you say into text, on this iPhone where it can.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
