<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>19 Shelves &middot; Luis James de Souza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="yt.css">
<style>
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(1.3rem,3vw,2.4rem);padding:1.6rem 0 .4rem;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero .lab{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.14;margin:.55rem 0}
.hero .who{display:flex;gap:.8rem;align-items:center;margin-top:1rem}
.hero .who .pt{width:48px;height:48px;overflow:hidden;border:1px solid var(--line)}
.hero .who .pt img{width:100%;height:100%;object-fit:cover;object-position:48% 24%}
.hero .who .nm{font-family:"Newsreader",Georgia,serif;font-size:1.06rem}
.hero .who .sub{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

</style>
</head>
<body>
<div class="lbar"><div class="in">
  <a class="wm" href="index.html">&larr;&nbsp; All the layouts</a>
  <span class="who">19 &nbsp;&middot;&nbsp; Shelves</span>
</div></div>
<div class="in">
  <p class="mo" style="padding-top:1.2rem">A private page &middot; the de Souza family</p>
  <div class="hero" id="hero"></div>
  <div id="shelves"></div>
  <div id="about"></div>
</div>
<footer class="in">
  <p>A private page for the de Souza family. The films are unlisted on YouTube &mdash; only people with this link can watch them.</p>
  <p>Luis James de Souza &nbsp;&middot;&nbsp; born 4 February 1943, Bangalore</p>
</footer>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="yt.js"></script>
<script>
var m = LUIS.main;
document.getElementById("hero").innerHTML = qcard(m, 0, true) +
  '<div><p class="lab">Start here</p><h1>' + esc(m.q) + '</h1>' +
  '<p style="color:var(--ink2);font-size:.96rem">' + m.note + '</p>' +
  '<div class="who"><span class="pt"><img src="avatar.jpg" alt=""></span>' +
  '<div><p class="nm">Luis James de Souza</p><p class="sub">Born 4 Feb 1943, Bangalore &middot; 83</p></div></div></div>';

var SHELVES = [
  { t:"Recorded so far", c:"four more", pick:function(x){ return x.v && !x.main; } },
  { t:"The easy ones, still to do", c:"two minutes each", pick:function(x){ return !x.v && x.easy; } },
  { t:"The ones worth sitting down for", c:"take your time", pick:function(x){ return !x.v && !x.easy; } }
];
document.getElementById("shelves").innerHTML = SHELVES.map(function(s){
  var items = LUIS.questions.map(function(x, i){ return {x:x, i:i}; }).filter(function(o){ return s.pick(o.x); });
  if(!items.length) return "";
  return '<div class="shelf"><div class="sh"><h2>' + s.t + '</h2><span class="c">' + s.c + '</span></div>' +
    '<div class="rowx">' + items.map(function(o){ return qcard(o.x, o.i); }).join("") + '</div></div>';
}).join("");
document.getElementById("about").innerHTML = aboutBlock();

wire();
</script>
</body>
</html>
