<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>19 Home shelves &middot; Luis James de Souza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="yt.css">
<style>
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:1.4rem;padding:1.4rem 0 .4rem;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero .film{border:0;border-radius:14px;aspect-ratio:16/9}
.hero .film .sh{display:none}
.hero .lab{font-size:.76rem;color:var(--yacc);font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.hero h1{font-size:clamp(1.4rem,2.8vw,2rem);line-height:1.2;margin:.5rem 0}
.hero .who{display:flex;gap:.7rem;align-items:center;margin-top:.9rem}
.hero .who .av{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--ychip)}
.hero .who .av img{width:100%;height:100%;object-fit:cover;object-position:46% 22%}
.hero .who .nm{font-size:.9rem;font-weight:500}
.hero .who .sub{color:var(--ymut);font-size:.78rem}

</style>
</head>
<body>
<div class="ybar"><div class="in">
  <a class="wm" href="index.html">Life<span>Questions</span></a>
  <div class="search"><input placeholder="Search this family" aria-label="Search"><span class="go">&#8981;</span></div>
  <span class="me"><img src="dad.jpg" alt=""></span>
</div></div>
<div class="in">
  <div id="tabs"></div>
  <div class="hero" id="hero"></div>
  <div id="shelves"></div>
  <div id="about"></div>
</div>
<div class="in" style="padding-top:2rem;padding-bottom:3rem;color:var(--ymut);font-size:.8rem">
  <p>A private channel for the de Souza family. Every film is unlisted &mdash; only people with this link can watch.</p>
  <p style="margin-top:.3rem"><a href="index.html" style="color:var(--ymut)">&larr; All the layouts</a></p>
</div>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="yt.js"></script>
<script>
document.getElementById("tabs").innerHTML = tabs("Home");
var m = LUIS.main;
document.getElementById("hero").innerHTML = film(m) +
  '<div><p class="lab">Start here</p><h1>' + esc(m.q) + '</h1>' +
  '<p style="color:var(--ymut);font-size:.9rem">' + m.note + '</p>' +
  '<div class="who"><span class="av"><img src="dad.jpg" alt=""></span>' +
  '<div><p class="nm">Luis James de Souza</p><p class="sub">Born 4 Feb 1943, Bangalore · 83</p></div></div>' +
  '<div class="acts" style="display:flex;gap:.6rem;margin-top:1rem">' +
  '<button class="ybtn">Play ' + m.len + '</button><button class="ybtn sec">Share the link</button></div></div>';

var SHELVES = [
  { t:"Recorded so far", c:"5 films", pick:function(x){ return x.v && !x.main; } },
  { t:"The easy ones, still to do", c:"two minutes each", pick:function(x){ return !x.v && x.easy; } },
  { t:"The ones worth sitting down for", c:"take your time", pick:function(x){ return !x.v && !x.easy; } }
];
document.getElementById("shelves").innerHTML = SHELVES.map(function(s){
  var items = LUIS.questions.map(function(x,i){ return {x:x,i:i}; }).filter(function(o){ return s.pick(o.x); });
  if(!items.length) return "";
  return '<div class="shelf"><h2>' + s.t + ' <span class="c">' + s.c + '</span></h2>' +
    '<div class="rowx">' + items.map(function(o){ return vcard(o.x, o.i); }).join("") + '</div></div>';
}).join("");
document.getElementById("about").innerHTML = aboutBlock();

wire();
</script>
</body>
</html>
