# Publishes the site to GitHub Pages.
#
# edit/build-pages.sh assembles what gets uploaded. It puts Life Questions at
# the root of the domain, moves the Goal Tracker to /goals.html to make room,
# leaves the Expense Tracker where it has always been, and leaves a redirect at
# every old /site/… address — Dad has /site/luis.html in a WhatsApp message and
# that link has to keep working.
#
# The spreadsheets, the originals of Dad's photographs and the editing kit are
# no longer published. They were going out with everything else.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "*.html"
      - "edit/build-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on if it isn't already, so this needs no
      # visit to the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: bash edit/build-pages.sh _pub

      # Stamp each stylesheet and script with the commit it came from. Without
      # this a browser keeps yesterday's CSS and the change looks like it never
      # deployed — which is exactly what it looked like.
      - name: Version the asset links
        run: |
          find _pub -name '*.html' -print0 |
            xargs -0 sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g"
          grep -o '?v=[0-9a-f]\{8\}' _pub/luis.html | head -1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pub

      - id: deployment
        uses: actions/deploy-pages@v4
