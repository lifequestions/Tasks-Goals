# Publishes the repository to GitHub Pages.
#
# The whole repository root is uploaded, not just site/, because this Pages
# site already served the trackers from the root before Life Questions
# existed. Narrowing it to site/ would take those offline:
#
#   /Tasks-Goals/         the Goal Tracker, as before
#   /Tasks-Goals/expenses.html
#   /Tasks-Goals/site/    Life Questions

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "*.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on if it isn't already, so this needs no
      # visit to the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Stamp each stylesheet and script with the commit it came from. Without
      # this a browser keeps yesterday's CSS and the change looks like it never
      # deployed — which is exactly what it looked like.
      - name: Version the asset links
        run: |
          find site -name '*.html' -print0 |
            xargs -0 sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g"
          grep -o '?v=[0-9a-f]\{8\}' site/luis.html | head -1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
