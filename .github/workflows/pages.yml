# Publishes the site to GitHub Pages.
#
# The site lives at the repository root, so what the repository holds is what
# the domain serves. edit/build-pages.sh only drops the parts that should not
# be on the open web: the spreadsheets, the originals of Dad's photographs and
# the editing kit. _config.yml does the same for GitHub's own branch builder.
#
# Those two builders both deploy, and whichever finishes last wins. That race
# is why a restructure that lived only in this workflow served a 404: the
# branch builder published the repository root, which did not have the pages
# in it. Settings → Pages → Source: GitHub Actions ends the race for good.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "CNAME"
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.jpg"
      - "options/**"
      - "site/**"
      - "_config.yml"
      - "edit/build-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on if it isn't already, so this needs no
      # visit to the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: bash edit/build-pages.sh _pub

      # Stamp each stylesheet and script with the commit it came from. Without
      # this a browser keeps yesterday's CSS and the change looks like it never
      # deployed — which is exactly what it looked like.
      - name: Version the asset links
        run: |
          find _pub -name '*.html' -print0 |
            xargs -0 sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g"
          grep -o '?v=[0-9a-f]\{8\}' _pub/luis.html | head -1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pub

      - id: deployment
        uses: actions/deploy-pages@v4
