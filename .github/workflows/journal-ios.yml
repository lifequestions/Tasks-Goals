# Builds the Undercurrent journal app (journal/) on a GitHub Mac.
#
#   build       every push that touches journal/: compiles for the simulator,
#               so a mistake in the Swift shows up here without needing a Mac.
#   testflight  once the Apple secrets below are set: signs the app and sends
#               it to TestFlight, where it installs on the iPhone.
#
# TestFlight needs, in Settings → Secrets and variables → Actions:
#   variable  BUNDLE_ID                      optional; defaults to com.desouza.lifequestionsjournal
#   secret    APPLE_TEAM_ID                  10 characters, from developer.apple.com → Membership
#   secret    APP_STORE_CONNECT_KEY_ID       from App Store Connect → Users and Access → Integrations
#   secret    APP_STORE_CONNECT_ISSUER_ID    same page
#   secret    APP_STORE_CONNECT_KEY          the whole contents of the .p8 file (Admin role)

name: Journal iOS app

on:
  push:
    paths:
      - "journal/**"
      - ".github/workflows/journal-ios.yml"
  workflow_dispatch:

concurrency:
  group: journal-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile for the simulator
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild build \
            -project journal/Undercurrent.xcodeproj \
            -scheme Undercurrent \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # Runs alongside the simulator build rather than after it: an archive that
  # doesn't compile fails here just as well, and the upload lands sooner.
  testflight:
    runs-on: macos-26
    env:
      HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      # App Store Connect only accepts builds made with the iOS 26 SDK or later.
      - name: Use the newest Xcode
        if: env.HAS_KEY == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Put the App Store Connect key where xcodebuild looks
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY" > ~/private_keys/AuthKey_$KEY_ID.p8

      - name: Archive, signed by Apple's cloud certificate
        if: env.HAS_KEY == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.desouza.lifequestionsjournal' }}
        run: |
          xcodebuild archive \
            -project journal/Undercurrent.xcodeproj \
            -scheme Undercurrent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Undercurrent.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Upload to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" journal/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Undercurrent.xcarchive" \
            -exportOptionsPlist journal/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
