<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ten Hero Arrangements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap">

<style>
:root{--bg:#FAF6EF;--band:#F3EDE3;--ink:#211F1C;--ink2:#6A645C;--ink3:#9A9289;--line:#E6DFD3;--acc:#2C5F5A}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#101211;font-family:"Karla",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* switcher */
.chrome{position:sticky;top:0;z-index:80;background:#101211;border-bottom:1px solid #232624;color:#E9E9E7}
.chrome-in{max-width:1500px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.clab{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#7C8189;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:.3rem;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:1px solid #2E3230;color:#9AA0A8;border-radius:999px;padding:.32rem .72rem;font-size:.7rem;font-weight:600;white-space:nowrap}
.tab:hover{color:#fff;border-color:#5B615E}
.tab[aria-pressed="true"]{background:#F2F2F0;color:#101211;border-color:#F2F2F0}
.note{max-width:1500px;margin:0 auto;padding:.4rem 1rem .65rem;font-size:.76rem;color:#8A918D;border-top:1px solid #1A1D1B}
.note b{color:#E9E9E7}

/* the page under test */
.stage{background:var(--bg);color:var(--ink);min-height:86vh;padding-bottom:3.5rem;overflow:hidden}
.top{max-width:1180px;margin:0 auto;padding:clamp(2.2rem,5vw,4rem) clamp(1.2rem,5vw,3rem) clamp(1.6rem,3.5vw,2.6rem);text-align:center}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--acc);margin:0}
h1{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:clamp(2.3rem,5.2vw,4rem);line-height:1.02;margin:.9rem auto 0;letter-spacing:-.018em;max-width:18ch}
h1 em{font-style:italic;color:var(--acc)}
.sub{color:var(--ink2);margin:1.1rem auto 0;max-width:52ch;font-size:1.08rem}
.cta{display:flex;gap:.7rem;margin-top:1.7rem;justify-content:center;flex-wrap:wrap}
.btn{background:var(--acc);color:#FAF6EF;border:1px solid var(--acc);border-radius:999px;padding:.85rem 1.7rem;font-weight:700;font-size:.95rem}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}

/* the photograph band, full width, below the words */
.band{position:relative;width:100%}
.pc{background:#fff;padding:8px;border-radius:4px;box-shadow:0 18px 36px -20px rgba(60,48,36,.5);overflow:hidden;border:0;
    transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .3s;display:block}
.pc img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}
.pc:hover{z-index:60;box-shadow:0 30px 54px -18px rgba(60,48,36,.55)}
.cap{position:absolute;left:0;right:0;bottom:-1.45rem;text-align:center;font-size:.76rem;color:var(--ink3)}

/* 01 one line, full bleed */
[data-h="1"] .band{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:0 clamp(.6rem,2vw,1.4rem)}
[data-h="1"] .pc{aspect-ratio:4/5}
[data-h="1"] .pc:hover{transform:translateY(-10px)}

/* 02 one line, bleeding off both edges */
[data-h="2"] .band{display:flex;gap:14px;width:118%;margin-left:-9%}
[data-h="2"] .pc{flex:1;aspect-ratio:3/4}
[data-h="2"] .pc:hover{transform:translateY(-10px)}

/* 03 arc */
[data-h="3"] .band{height:clamp(260px,26vw,420px)}
[data-h="3"] .pc{position:absolute;width:clamp(110px,13vw,205px);aspect-ratio:4/5}

/* 04 four by two */
[data-h="4"] .band{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1180px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}
[data-h="4"] .pc{aspect-ratio:4/5}
[data-h="4"] .pc:hover{transform:translateY(-8px)}

/* 05 four by two, square and tight */
[data-h="5"] .band{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:1180px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}
[data-h="5"] .pc{aspect-ratio:1;padding:0;border-radius:3px;box-shadow:none;border:1px solid var(--line)}
[data-h="5"] .pc:hover{transform:scale(1.04)}

/* 06 one line, overlapping strip */
[data-h="6"] .band{display:flex;justify-content:center;padding:0 1rem}
[data-h="6"] .pc{width:clamp(100px,14vw,210px);aspect-ratio:4/5;margin-left:-3.2vw}
[data-h="6"] .pc:first-child{margin-left:0}
[data-h="6"] .pc:hover{transform:translateY(-14px) scale(1.05)}

/* 07 one line, staggered */
[data-h="7"] .band{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;align-items:start;padding:0 clamp(.8rem,2.5vw,2rem)}
[data-h="7"] .pc{aspect-ratio:4/5}
[data-h="7"] .pc:nth-child(even){margin-top:clamp(24px,3.4vw,58px)}
[data-h="7"] .pc:hover{transform:translateY(-10px)}

/* 08 full bleed, no gaps */
[data-h="8"] .band{display:grid;grid-template-columns:repeat(8,1fr);gap:0}
[data-h="8"] .pc{aspect-ratio:3/4;padding:0;border-radius:0;box-shadow:none}
[data-h="8"] .pc:hover{transform:scale(1.06)}

/* 09 tapering line, biggest in the middle */
[data-h="9"] .band{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1vw,16px);padding:0 1rem}
[data-h="9"] .pc{aspect-ratio:4/5}
[data-h="9"] .pc:hover{transform:translateY(-10px)}

/* 10 low wide fan */
[data-h="10"] .band{height:clamp(280px,28vw,440px);display:flex;align-items:center;justify-content:center}
[data-h="10"] .pc{position:absolute;width:clamp(120px,14vw,215px);aspect-ratio:4/5;transform-origin:50% 130%}

@media (max-width:820px){
  [data-h="1"] .band,[data-h="7"] .band,[data-h="8"] .band{grid-template-columns:repeat(4,1fr)}
  [data-h="4"] .band,[data-h="5"] .band{grid-template-columns:repeat(2,1fr)}
  [data-h="2"] .band{flex-wrap:wrap;width:100%;margin-left:0}
  [data-h="2"] .pc{flex:0 0 calc(50% - 7px)}
  [data-h="6"] .pc{margin-left:-6vw}
}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>

<div class="chrome">
  <div class="chrome-in">
    <span class="clab">Photographs below the words</span>
    <div class="tabs" id="tabs"></div>
  </div>
  <p class="note" id="note"></p>
</div>

<div class="stage" id="stage" data-h="1">
  <div class="top">
    <p class="eyebrow">Their life, in their own voice</p>
    <h1>One day you'll want to hear them <em>tell it again</em>.</h1>
    <p class="sub">A life biography, recorded rather than written. Your mother, your father, a grandparent, an aunt &mdash; or yourself.</p>
    <div class="cta"><span class="btn">Start their page &mdash; free</span><span class="btn ghost">See how it works</span></div>
  </div>
  <div class="band" id="band"></div>
</div>

<script>
var PHOTOS = ["f1.jpg","f2.jpg","f3.jpg","f4.jpg","f5.jpg","f6.jpg","f7.jpg","f8.jpg"];

var HEROES = [
  { n:"One line",        note:"All eight across the full width, evenly spaced. Simple, and the faces are big enough to read from across the room." },
  { n:"Line, bleeding",  note:"The same line pushed wider than the page, so the two end photographs run off the edges — it reads as part of something larger." },
  { n:"Arc",             note:"Laid along a shallow curve, the middle riding highest. Needs the height but it is the most distinctive of the ten." },
  { n:"Four by two",     note:"Two rows of four at full size. The most photographs you can show without any of them getting small." },
  { n:"Four by two, tight", note:"Same grid, square crops, six-pixel gaps and no white border — one block of faces rather than eight pictures." },
  { n:"Overlapping",     note:"A single line with each print laid partly over the last, like a hand of photographs spread on a table." },
  { n:"Staggered line",  note:"One line, every other photograph dropped down. Keeps the order but loses the ruler-straight feel." },
  { n:"Full bleed",      note:"Edge to edge, no gaps, no borders, touching the sides of the screen. The boldest and the least fussy." },
  { n:"Tapering",        note:"Biggest in the middle, smaller towards the edges, so your eye starts at the centre and works outwards." },
  { n:"Low fan",         note:"The fan again, but wide, low and large — spread across the foot of the hero rather than tucked beside the text." }
];

var stage=document.getElementById("stage"), band=document.getElementById("band"),
    tabs=document.getElementById("tabs"), note=document.getElementById("note");
var active=1;

function card(i){
  var b=document.createElement("button");
  b.className="pc";
  b.setAttribute("aria-label","A photograph");
  b.innerHTML='<img src="'+PHOTOS[i%PHOTOS.length]+'" alt="">';
  return b;
}

function build(n){
  band.innerHTML="";
  band.removeAttribute("style");
  for(var i=0;i<8;i++){ band.appendChild(card(i)); }
  var cards=Array.prototype.slice.call(band.children);

  if(n===3){                                   /* arc */
    cards.forEach(function(c,i){
      var t=i/(cards.length-1);
      c.style.left=(t*86+1)+"%";
      c.style.top=(38-Math.sin(t*Math.PI)*30)+"%";
      c.style.transform="rotate("+((i-3.5)*4.6)+"deg)";
      c.style.zIndex=String(10+i);
      c.addEventListener("mouseenter",function(){ c.style.transform="rotate(0deg) translateY(-14px) scale(1.06)"; });
      c.addEventListener("mouseleave",function(){ c.style.transform="rotate("+((i-3.5)*4.6)+"deg)"; });
    });
  }
  if(n===6){                                   /* overlapping: front to back, left to right */
    cards.forEach(function(c,i){ c.style.zIndex=String(20-i); });
  }
  if(n===9){                                   /* tapering */
    var sizes=[10,13,16,19,19,16,13,10];
    cards.forEach(function(c,i){ c.style.width="clamp(72px,"+sizes[i]+"vw,"+(sizes[i]*13)+"px)"; });
  }
  if(n===10){                                  /* low wide fan */
    var mid=(cards.length-1)/2;
    cards.forEach(function(c,i){
      var off=i-mid;
      c.style.zIndex=String(20-Math.abs(off)*2);
      var base="rotate("+(off*7)+"deg) translate("+(off*7.4)+"vw,"+(Math.abs(off)*14)+"px)";
      c.style.transform=base;
      c.addEventListener("mouseenter",function(){ c.style.transform=base+" translateY(-18px) scale(1.07)"; });
      c.addEventListener("mouseleave",function(){ c.style.transform=base; });
    });
  }
}

function setHero(n){
  active=n;
  stage.setAttribute("data-h",String(n));
  build(n);
  note.innerHTML="<b>"+("0"+n).slice(-2)+" &middot; "+HEROES[n-1].n+"</b> &nbsp;&mdash;&nbsp; "+HEROES[n-1].note;
  Array.prototype.forEach.call(tabs.children,function(t,i){ t.setAttribute("aria-pressed",String(i+1===n)); });
}

HEROES.forEach(function(h,i){
  var b=document.createElement("button");
  b.className="tab";
  b.textContent=("0"+(i+1)).slice(-2)+" "+h.n;
  b.addEventListener("click",function(){ setHero(i+1); });
  tabs.appendChild(b);
});
document.addEventListener("keydown",function(e){
  if(e.key==="[" && active>1){ setHero(active-1); }
  if(e.key==="]" && active<HEROES.length){ setHero(active+1); }
});
setHero(1);
</script>

</html>
