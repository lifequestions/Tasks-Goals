<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ten Hero Arrangements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap">

<style>
:root{--bg:#FAF6EF;--ink:#211F1C;--ink2:#6A645C;--ink3:#9A9289;--line:#E6DFD3;--acc:#2C5F5A;--shadow:rgba(60,48,36,.5)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#101211;font-family:"Karla",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.chrome{position:sticky;top:0;z-index:80;background:#101211;border-bottom:1px solid #232624;color:#E9E9E7}
.chrome-in{max-width:1500px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.clab{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#7C8189;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:.3rem;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:1px solid #2E3230;color:#9AA0A8;border-radius:999px;padding:.32rem .72rem;font-size:.7rem;font-weight:600;white-space:nowrap}
.tab:hover{color:#fff;border-color:#5B615E}
.tab[aria-pressed="true"]{background:#F2F2F0;color:#101211;border-color:#F2F2F0}
.note{max-width:1500px;margin:0 auto;padding:.4rem 1rem .65rem;font-size:.76rem;color:#8A918D;border-top:1px solid #1A1D1B}
.note b{color:#E9E9E7}

.stage{background:var(--bg);color:var(--ink);min-height:88vh;padding-bottom:4rem;overflow:hidden}
.eyebrow{font-size:.82rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--acc);margin:0}
h1{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:clamp(2.4rem,5.2vw,4.2rem);line-height:1.02;margin:1rem 0 0;letter-spacing:-.018em}
h1 em{font-style:italic;color:var(--acc)}
.sub{color:var(--ink2);margin-top:1.3rem;font-size:clamp(1.14rem,1.85vw,1.4rem);line-height:1.55}
.cta{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap}
.btn{background:var(--acc);color:#FAF6EF;border:1px solid var(--acc);border-radius:999px;padding:.9rem 1.8rem;font-weight:700;font-size:1rem}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.fine{font-size:1rem;color:var(--ink3);margin-top:1.2rem}

/* below-the-words layout */
.stage[data-mode="below"] .top{max-width:980px;margin:0 auto;text-align:center;padding:clamp(2.2rem,5vw,4rem) clamp(1.2rem,5vw,3rem) 0}
.stage[data-mode="below"] h1{max-width:18ch;margin-inline:auto}
.stage[data-mode="below"] .sub{max-width:56ch;margin-inline:auto}
.stage[data-mode="below"] .cta,.stage[data-mode="below"] .fine{justify-content:center;text-align:center}
.stage[data-mode="below"] .band{margin-top:clamp(2.2rem,4.5vw,3.4rem)}

/* side layout */
.stage[data-mode="side"] .wrap{max-width:1280px;margin:0 auto;padding:clamp(2rem,5vw,4rem) clamp(1.2rem,4vw,2.6rem);
  display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(1.6rem,4vw,3.4rem);align-items:center}
@media (max-width:940px){.stage[data-mode="side"] .wrap{grid-template-columns:1fr}}
.stage[data-mode="side"] h1{max-width:14ch}
.stage[data-mode="side"] .sub{max-width:40ch}

/* the print */
.pc{background:#fff;padding:10px;border-radius:4px;box-shadow:0 20px 38px -20px var(--shadow);overflow:hidden;border:0;display:block;
    transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .3s}
.pc img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:2px}
.pc.named{padding-bottom:2.5rem}
.pc .cap{position:absolute;left:0;right:0;bottom:.85rem;text-align:center;font-family:"Fraunces",Georgia,serif;font-size:.92rem;color:var(--ink2)}
.pc{position:relative}
.pc:hover{z-index:60;box-shadow:0 34px 60px -18px var(--shadow)}

/* 01 + 02 four by two */
[data-h="1"] .band,[data-h="2"] .band{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.5vw,22px);max-width:1180px;margin-inline:auto;padding:0 clamp(1.2rem,5vw,3rem)}
[data-h="1"] .pc:hover,[data-h="2"] .pc:hover{transform:translateY(-9px)}
[data-h="2"] .band{max-width:1320px;gap:clamp(14px,1.8vw,26px)}

/* 03 + 04 wide fans below */
[data-h="3"] .band,[data-h="4"] .band{position:relative;height:clamp(340px,34vw,520px);display:flex;align-items:center;justify-content:center}
[data-h="3"] .pc,[data-h="4"] .pc{position:absolute;width:clamp(150px,17vw,268px);transform-origin:50% 135%}
[data-h="4"] .pc{width:clamp(160px,19vw,300px)}

/* 05 side fan */
[data-h="5"] .band{position:relative;height:clamp(360px,32vw,520px);display:flex;align-items:center;justify-content:center}
[data-h="5"] .pc{position:absolute;width:clamp(120px,13vw,205px);transform-origin:50% 140%}

/* 06 side grid 2x4 */
[data-h="6"] .band{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1vw,14px)}
[data-h="6"] .pc{padding:7px}
[data-h="6"] .pc:hover{transform:translateY(-7px)}

/* 07 side staggered columns */
[data-h="7"] .band{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1vw,14px);align-items:start}
[data-h="7"] .pc{padding:7px}
[data-h="7"] .pc:nth-child(even){margin-top:clamp(20px,3vw,52px)}
[data-h="7"] .pc:hover{transform:translateY(-7px)}

/* 08 side scatter */
[data-h="8"] .band{position:relative;height:clamp(380px,34vw,540px)}
[data-h="8"] .pc{position:absolute;width:clamp(110px,12.5vw,190px)}

@media (max-width:820px){
  [data-h="1"] .band,[data-h="2"] .band,[data-h="6"] .band,[data-h="7"] .band{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>

<div class="chrome">
  <div class="chrome-in">
    <span class="clab">Hero arrangements</span>
    <div class="tabs" id="tabs"></div>
  </div>
  <p class="note" id="note"></p>
</div>

<div class="stage" id="stage" data-h="1" data-mode="below"></div>

<script>
var PEOPLE = [
  { img:"f1.jpg", cap:"Ray, 86" },
  { img:"f2.jpg", cap:"Tenzin, 79" },
  { img:"f3.jpg", cap:"Aleks, 84" },
  { img:"f4.jpg", cap:"Margaret, 81" },
  { img:"f5.jpg", cap:"Iris, 78" },
  { img:"f6.jpg", cap:"Halina, 88" },
  { img:"f7.jpg", cap:"Shanti, 83" },
  { img:"f8.jpg", cap:"Luis, 83" }
];

var HEROES = [
  { n:"4&times;2 + names",  mode:"below", names:true,  note:"The one you chose, with a name and age under each photograph." },
  { n:"4&times;2 bigger",   mode:"below", names:true,  note:"Same again, pushed wider with more air between the prints, so each face is larger still." },
  { n:"Fan, wide",          mode:"below", names:true,  note:"The fan spread right across the foot of the hero &mdash; 11&deg; apart, prints half as big again as before." },
  { n:"Fan, widest",        mode:"below", names:false, note:"Wider still and larger, almost a straight line of prints. No names, so nothing crowds the faces." },
  { n:"Side fan",           mode:"side",  names:true,  note:"Words left, a fan of all eight on the right &mdash; the layout from your screenshot, opened out properly." },
  { n:"Side grid",          mode:"side",  names:false, note:"Words left, a tidy two-by-four block on the right. The calmest of the side layouts." },
  { n:"Side staggered",     mode:"side",  names:false, note:"Words left, four columns with every other print dropped, so the block has a rhythm to it." },
  { n:"Side scatter",       mode:"side",  names:true,  note:"Words left, prints dropped at angles on the right as though someone spread them on the table." }
];

var stage=document.getElementById("stage"), tabs=document.getElementById("tabs"), note=document.getElementById("note");
var active=1;

var COPY = '<p class="eyebrow">Their life, in their own voice</p>' +
  '<h1>One day you&rsquo;ll want to hear them <em>tell it again</em>.</h1>' +
  '<p class="sub">A life biography, recorded rather than written. We send the questions; they answer on your phone, at their own kitchen table.</p>' +
  '<div class="cta"><span class="btn">Start their page &mdash; free</span><span class="btn ghost">See how it works</span></div>' +
  '<p class="fine">Free to start &nbsp;·&nbsp; No app to install &nbsp;·&nbsp; Private unless you share it</p>';

function print(p, named){
  var b=document.createElement("button");
  b.className="pc" + (named ? " named" : "");
  b.setAttribute("aria-label", p.cap);
  b.innerHTML='<img src="'+p.img+'" alt="">' + (named ? '<span class="cap">'+p.cap+'</span>' : '');
  return b;
}

function setHero(n){
  active=n;
  var h=HEROES[n-1];
  stage.setAttribute("data-h",String(n));
  stage.setAttribute("data-mode",h.mode);
  stage.innerHTML = h.mode==="below"
    ? '<div class="top">'+COPY+'</div><div class="band" id="band"></div>'
    : '<div class="wrap"><div>'+COPY+'</div><div class="band" id="band"></div></div>';

  var band=document.getElementById("band");
  PEOPLE.forEach(function(p){ band.appendChild(print(p, h.names)); });
  var cards=Array.prototype.slice.call(band.children);
  var mid=(cards.length-1)/2;

  if(n===3 || n===4 || n===5){                       /* fans */
    var deg = n===3 ? 11 : n===4 ? 8 : 13;
    var dx  = n===3 ? 8.4 : n===4 ? 10.2 : 5.2;      /* vw between prints */
    var dy  = n===5 ? 15 : 17;
    cards.forEach(function(c,i){
      var off=i-mid;
      c.style.zIndex=String(20-Math.abs(off)*2);
      var t="rotate("+(off*deg)+"deg) translate("+(off*dx)+"vw,"+(Math.abs(off)*dy)+"px)";
      c.style.transform=t;
      c.addEventListener("mouseenter",function(){ c.style.transform=t+" translateY(-20px) scale(1.07)"; });
      c.addEventListener("mouseleave",function(){ c.style.transform=t; });
    });
  }
  if(n===8){                                          /* scatter */
    var spots=[[1,4,-8],[26,0,5],[52,7,-4],[4,40,6],[30,46,-6],[57,38,7],[16,22,-3],[44,24,4]];
    cards.forEach(function(c,i){
      var s=spots[i];
      c.style.left=s[0]+"%"; c.style.top=s[1]+"%";
      c.style.zIndex=String(10+i);
      var t="rotate("+s[2]+"deg)";
      c.style.transform=t;
      c.addEventListener("mouseenter",function(){ c.style.transform="rotate(0deg) scale(1.08)"; });
      c.addEventListener("mouseleave",function(){ c.style.transform=t; });
    });
  }

  note.innerHTML="<b>"+("0"+n).slice(-2)+" &middot; "+h.n+"</b> &nbsp;&mdash;&nbsp; "+h.note;
  Array.prototype.forEach.call(tabs.children,function(t,i){ t.setAttribute("aria-pressed",String(i+1===n)); });
}

HEROES.forEach(function(h,i){
  var b=document.createElement("button");
  b.className="tab";
  b.innerHTML=("0"+(i+1)).slice(-2)+" "+h.n;
  b.addEventListener("click",function(){ setHero(i+1); });
  tabs.appendChild(b);
});
document.addEventListener("keydown",function(e){
  if(e.key==="[" && active>1){ setHero(active-1); }
  if(e.key==="]" && active<HEROES.length){ setHero(active+1); }
});
setHero(1);
</script>

</html>
